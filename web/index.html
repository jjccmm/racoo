<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('racoo-theme'); } catch { /* Storage is optional. */ }
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      })();
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="8b14f323-fb03-47ba-b65a-0807ffdf3032"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Finde mit ein paar Schlüsselwörtern die gesuchte Podcast-Folge." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%images/racoo-icon.svg" />
    <title>Racoo · Die Podcast Wort Suche</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
