[project]
name = "podcast-words"
version = "0.1.0"
description = "Offline podcast transcription contracts and processing tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
podcast-words = "podcast_words.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
