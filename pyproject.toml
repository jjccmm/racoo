[project]
name = "podcast-words"
version = "0.1.0"
description = "Offline podcast transcription contracts and processing tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
analysis = ["spacy==3.8.16"]

[project.scripts]
podcast-words = "podcast_words.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
cpu = ["onnx-asr[cpu,hub]==0.12.0", "onnxruntime==1.27.0"]
gpu = ["onnx-asr[gpu,hub]==0.12.0", "onnxruntime-gpu==1.27.0"]
dev = ["imageio-ffmpeg==0.6.0", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
